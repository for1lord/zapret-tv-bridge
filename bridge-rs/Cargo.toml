[package]
name = "zapret-tv-bridge-rs"
version = "1.13.0"
edition = "2021"

[lib]
name = "zapret_tv_bridge_rs"
path = "src/lib.rs"

[[bin]]
name = "ZapretTVBridge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
bytes = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
ipnet = "2.10"
parking_lot = "0.12"
httparse = "1.9"
socket2 = "0.6"
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "json"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
aes = "0.8"
ctr = "0.9"
cipher = "0.4"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
subtle = "2.5"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
